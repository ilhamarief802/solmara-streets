<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmara Streets: a third-person open-world crime sandbox set in a fictional sun-soaked coastal city, generated deterministically in the browser with three.js. Phase one: the living world.">
<title>Solmara Streets</title>
<link rel="stylesheet" href="./styles/base.css">
<script>
  /* Earliest possible failure surface: this runs before any module loads, so a
     syntax error or a missing vendored three.js shows up as readable text on the
     page instead of a black canvas. src/core/debug.js adopts this same element
     once the game boots and takes over reporting. */
  (function () {
    window.__EARLY_ERRORS = [];
    function show(message) {
      var box = document.getElementById('error-overlay');
      if (!box) return;
      box.hidden = false;
      var pre = document.createElement('pre');
      pre.textContent = String(message);
      box.appendChild(pre);
    }
    window.addEventListener('error', function (event) {
      if (!event) return;
      var where = event.filename ? ' @ ' + event.filename + ':' + (event.lineno || 0) : '';
      window.__EARLY_ERRORS.push(String(event.message) + where);
      show('[boot] ' + event.message + where);
    });
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason;
      var text = (reason && (reason.stack || reason.message)) || String(reason);
      window.__EARLY_ERRORS.push(text);
      show('[boot promise] ' + text);
    });
    window.addEventListener('DOMContentLoaded', function () {
      if (typeof window.THREE !== 'object') show('[boot] vendor/three.min.js did not load: the global THREE object is missing.');
    });
  })();
</script>
</head>
<body>
<canvas id="viewport" aria-label="Solmara Streets, an open-world city rendered in three.js"></canvas>
<div id="error-overlay" role="alert" hidden></div>
<div id="debug-overlay" hidden></div>
<div id="boot">Booting Solmara Streets&hellip;</div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
